<!DOCTYPE html>
<html lang="en">
<head>
    <title>WebSharper.UI.CSharp.Tests</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="Content/WebSharper.UI.CSharp.Tests.css" />
    <style>
        [ws-template], [ws-children-template] {
            display: none;
        }
    </style>
    <script type="text/javascript" src="Content/WebSharper.UI.CSharp.Tests.head.js"></script>
</head>
<body>
    <div id="main">
        <h1 ws-template="tasksTitle">Tasks</h1>
        <template id="HTML5Template">
            <slot name="ThisIsOk"></slot>
            <slot></slot>
        </template>
    </div>
    <div ws-dom="TestDom"></div>
    <div id="bindTest">
        <h2>Bound in place by ${BindTitle}</h2>
        <input id="bindInput" ws-var="BindInput" />
        <p id="bindEcho">You typed: ${BindInput}</p>
        <button id="bindButton" type="button" ws-onclick="BindClick">Click</button>
        <p id="bindClicks">${BindClicks}</p>
    </div>
    <div id="tasksTitle"></div>
    <div id="tasks"></div>
    <script type="module" src="Content/WebSharper.UI.CSharp.Tests.js"></script>
</body>
</html>
